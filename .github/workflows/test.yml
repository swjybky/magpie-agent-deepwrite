name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - name: Install Electron for native Windows credential verification
        if: runner.os == 'Windows'
        run: npm install --no-save --package-lock=false electron@42.5.0
      - run: npm test
        env:
          BUN_BIN: bun
          ELECTRON_BIN: node_modules/electron/dist/electron.exe
